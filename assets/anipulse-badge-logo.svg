<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="neonGrad" x1="20" y1="20" x2="280" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="irisGrad" x1="120" y1="83" x2="180" y2="143" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="55" y1="230" x2="245" y2="266" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- outer badge disc -->
  <circle cx="150" cy="150" r="130" fill="#0a0e1a" stroke="url(#neonGrad)" stroke-width="5"/>
  <!-- inner radar ring -->
  <circle cx="150" cy="150" r="111" fill="none" stroke="url(#neonGrad)" stroke-width="1.5" opacity="0.55"/>

  <!-- radar ticks -->
  <g stroke="url(#neonGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
    <line x1="150.0" y1="39.0" x2="150.0" y2="28.0"/>
    <line x1="94.5" y1="53.9" x2="89.0" y2="44.3"/>
    <line x1="53.9" y1="94.5" x2="44.3" y2="89.0"/>
    <line x1="39.0" y1="150.0" x2="28.0" y2="150.0"/>
    <line x1="53.9" y1="205.5" x2="44.3" y2="211.0"/>
    <line x1="94.5" y1="246.1" x2="89.0" y2="255.7"/>
    <line x1="150.0" y1="261.0" x2="150.0" y2="272.0"/>
    <line x1="205.5" y1="246.1" x2="211.0" y2="255.7"/>
    <line x1="246.1" y1="205.5" x2="255.7" y2="211.0"/>
    <line x1="261.0" y1="150.0" x2="272.0" y2="150.0"/>
    <line x1="246.1" y1="94.5" x2="255.7" y2="89.0"/>
    <line x1="205.5" y1="53.9" x2="211.0" y2="44.3"/>
  </g>

  <!-- anime eye mark -->
  <path d="M75,120 Q150,68 233,96 Q158,142 75,120 Z" fill="#f8fafc" stroke="url(#neonGrad)" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- outer-corner lash flicks -->
  <g stroke="url(#neonGrad)" stroke-width="4" stroke-linecap="round" fill="none">
    <line x1="233" y1="96" x2="248" y2="80"/>
    <line x1="226" y1="92" x2="236" y2="74"/>
  </g>
  <!-- iris / pupil / play glyph -->
  <circle cx="150" cy="113" r="30" fill="url(#irisGrad)"/>
  <circle cx="150" cy="113" r="13" fill="#0a0e1a"/>
  <circle cx="141" cy="103" r="5" fill="#ffffff"/>
  <circle cx="160" cy="121" r="2.5" fill="#ffffff" opacity="0.8"/>
  <path d="M146,107 L146,119 L157,113 Z" fill="#f8fafc"/>

  <!-- tagline -->
  <text x="150" y="198" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold"
        font-size="15" letter-spacing="5" fill="#67e8f9">ANIME FINDER</text>

  <!-- ribbon banner -->
  <polygon points="8,250 55,230 55,270" fill="#5b21b6"/>
  <polygon points="292,250 245,230 245,270" fill="#5b21b6"/>
  <rect x="55" y="230" width="190" height="40" fill="url(#ribbonGrad)"/>
  <text x="150" y="257" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold"
        font-size="32" letter-spacing="3" fill="#ffffff">ANIPULSE</text>
</svg>
