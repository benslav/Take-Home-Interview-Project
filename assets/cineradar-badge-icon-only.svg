<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="neonGrad" x1="20" y1="20" x2="280" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="filmGrad" x1="86" y1="93" x2="214" y2="207" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
  </defs>

  <!-- outer badge disc -->
  <circle cx="150" cy="150" r="130" fill="#0a0e1a" stroke="url(#neonGrad)" stroke-width="5"/>
  <!-- inner radar ring -->
  <circle cx="150" cy="150" r="111" fill="none" stroke="url(#neonGrad)" stroke-width="1.5" opacity="0.55"/>

  <!-- radar ticks -->
  <g stroke="url(#neonGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
    <line x1="150.0" y1="39.0" x2="150.0" y2="28.0"/>
    <line x1="94.5" y1="53.9" x2="89.0" y2="44.3"/>
    <line x1="53.9" y1="94.5" x2="44.3" y2="89.0"/>
    <line x1="39.0" y1="150.0" x2="28.0" y2="150.0"/>
    <line x1="53.9" y1="205.5" x2="44.3" y2="211.0"/>
    <line x1="94.5" y1="246.1" x2="89.0" y2="255.7"/>
    <line x1="150.0" y1="261.0" x2="150.0" y2="272.0"/>
    <line x1="205.5" y1="246.1" x2="211.0" y2="255.7"/>
    <line x1="246.1" y1="205.5" x2="255.7" y2="211.0"/>
    <line x1="261.0" y1="150.0" x2="272.0" y2="150.0"/>
    <line x1="246.1" y1="94.5" x2="255.7" y2="89.0"/>
    <line x1="205.5" y1="53.9" x2="211.0" y2="44.3"/>
  </g>

  <!-- film-strip + play mark, centered on the circle -->
  <rect x="68" y="93" width="164" height="114" rx="10" fill="none" stroke="url(#filmGrad)" stroke-width="8"/>
  <g fill="url(#filmGrad)">
    <circle cx="86" cy="93" r="7"/>
    <circle cx="118" cy="93" r="7"/>
    <circle cx="150" cy="93" r="7"/>
    <circle cx="182" cy="93" r="7"/>
    <circle cx="214" cy="93" r="7"/>
    <circle cx="86" cy="207" r="7"/>
    <circle cx="118" cy="207" r="7"/>
    <circle cx="150" cy="207" r="7"/>
    <circle cx="182" cy="207" r="7"/>
    <circle cx="214" cy="207" r="7"/>
  </g>
  <path d="M130,118 L130,182 L192,150 Z" fill="url(#filmGrad)"/>
</svg>
